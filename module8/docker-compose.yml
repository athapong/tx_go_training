version: "3.9"

# ============================================================
# Module 8: Enterprise Observability Stack
# รัน: docker-compose up -d
# หยุด: docker-compose down
# ============================================================
#
# Services:
#   prometheus  → scrape metrics จาก order-service
#   grafana     → dashboard สวยงาม (Four Golden Signals)
#   jaeger      → distributed tracing UI
#   order-service → ตัว demo service (build จาก complete_service/)
#
# Ports:
#   8080  → order-service (HTTP API + /metrics)
#   9090  → Prometheus UI
#   3000  → Grafana (admin/admin)
#   16686 → Jaeger UI
#   4317  → OTLP gRPC (Jaeger collector)
#   4318  → OTLP HTTP (Jaeger collector)

networks:
  observability:
    driver: bridge

volumes:
  prometheus_data: {}
  grafana_data: {}

services:
  # ──────────────────────────────────────────────────────────
  # PROMETHEUS — collect and store metrics
  # ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"         # รองรับ hot-reload config
      - "--web.enable-remote-write-receiver"
    networks:
      - observability

  # ──────────────────────────────────────────────────────────
  # GRAFANA — visualize metrics and logs
  # ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin   # ไม่ต้อง login สำหรับ demo
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - observability

  # ──────────────────────────────────────────────────────────
  # JAEGER — distributed tracing (all-in-one for dev)
  # ──────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4319:4317"     # OTLP gRPC (host 4319, container 4317)
      - "4320:4318"     # OTLP HTTP (host 4320, container 4318)
      - "14268:14268"   # Jaeger thrift (legacy)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=50000
    networks:
      - observability

  # ──────────────────────────────────────────────────────────
  # ORDER SERVICE — demo service (build locally)
  # ──────────────────────────────────────────────────────────
  # Uncomment เพื่อ build และรัน service ใน container
  # ต้องมี Dockerfile ใน complete_service/ ก่อน
  #
  # order-service:
  #   build:
  #     context: ./complete_service
  #     dockerfile: Dockerfile
  #   container_name: order-service
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - PORT=8080
  #     - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
  #     - LOG_LEVEL=info
  #   depends_on:
  #     - jaeger
  #     - prometheus
  #   networks:
  #     - observability
